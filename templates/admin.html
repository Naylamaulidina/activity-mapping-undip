<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin - WebGIS</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6fb; padding: 30px; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #2e3a59; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .header a { color: white; text-decoration: none; background: #e74c3c; padding: 8px 16px; border-radius: 6px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #eef2fa; color: #2e3a59; }
        .btn-hapus { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-hapus:hover { background: #c0392b; }
    </style>
</head>
<body>
    <div class="header">
        <h2>🛠️ Panel Kelola Data Laporan</h2>
        <div>
            <a href="/" style="background: #667eea; margin-right: 10px;">Lihat Peta</a>
            <a href="/logout">Logout</a>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Waktu</th>
                <th>Nama</th>
                <th>Lokasi</th>
                <th>Status</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody>
            {% for report in reports %}
            <tr>
                <td>{{ report.timestamp }}</td>
                <td>{{ report.nama or 'Anonim' }}</td>
                <td>{{ report.lokasi }}</td>
                <td>{{ report.tingkat_keramaian }}</td>
                <td>
                    <form action="/hapus_laporan/{{ report.id }}" method="POST" onsubmit="return confirm('Yakin ingin menghapus laporan ini beserta fotonya secara permanen?');">
                        <button type="submit" class="btn-hapus">🗑️ Hapus</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="5" style="text-align:center; padding: 20px;">Belum ada laporan.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
